<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LeadFlow</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card">
      <h1>LeadFlow</h1>
      <p class="muted">Forms, leads &amp; marketing automation</p>
      <input type="email" name="email" placeholder="Email" autocomplete="username" autofocus>
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <div class="muted small">Owner login: leave email blank and use the admin password.</div>
      <button class="btn primary">Sign in</button>
      <div class="err" id="login-err"></div>
    </form>
  </div>
  <div id="accept" class="login hidden"></div>
  <div id="shell" class="shell hidden">
    <nav class="side">
      <div class="brand">LeadFlow</div>
      <div class="nav-label">Sales</div>
      <a href="#/" data-nav="exec">Executive Summary</a>
      <a href="#/pipeline" data-nav="pipeline">Pipeline</a>
      <a href="#/personas" data-nav="personas">Personas</a>
      <div class="nav-label">Marketing</div>
      <a href="#/marketing" data-nav="dashboard">Dashboard</a>
      <a href="#/contacts" data-nav="contacts">Contacts</a>
      <a href="#/forms" data-nav="forms">Forms</a>
      <a href="#/workflows" data-nav="workflows">Workflows</a>
      <a href="#/emails" data-nav="emails">Emails</a>
      <a href="#/broadcasts" data-nav="broadcasts">Broadcasts</a>
      <div class="nav-label admin-only">Admin</div>
      <a href="#/users" data-nav="users" class="admin-only">Users</a>
      <a href="#/settings" data-nav="settings" class="admin-only">Settings</a>
      <div id="whoami" class="whoami"></div>
      <a href="#" id="logout" class="logout">Sign out</a>
    </nav>
    <main id="view"></main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
  <script src="/pipeline.js"></script>
</body>
</html>
